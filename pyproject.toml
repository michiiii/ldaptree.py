[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "ldaptree"
version = "2.0"
description = "Enumerate Active Directory OU structure as a hierarchical tree"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "ldap3",
    "pycryptodome",
]

[project.optional-dependencies]
# Needed only for --acl (parsing the nTSecurityDescriptor blob).
acl = ["impacket"]

[project.scripts]
"ldaptree.py" = "_ldaptree:main"

[tool.setuptools]
py-modules = ["_ldaptree"]
